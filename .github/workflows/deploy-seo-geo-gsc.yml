name: Deploy GSC Edge Function

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/seo-geo-collect-gsc/**'
      - '.github/workflows/deploy-seo-geo-gsc.yml'

permissions:
  contents: read

concurrency:
  group: deploy-seo-geo-gsc
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy seo-geo-collect-gsc
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          PROJECT_REF: kypdwfekjmduckcfsgrk
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Skipping deploy; add GitHub secret SUPABASE_ACCESS_TOKEN (Account → Access Tokens)."
            exit 0
          fi
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "Skipping deploy; GSC_SERVICE_ACCOUNT_JSON is not set."
            exit 0
          fi
          npx supabase secrets set --project-ref "$PROJECT_REF" "GSC_SERVICE_ACCOUNT_JSON=$GSC_SERVICE_ACCOUNT_JSON"
          npx supabase functions deploy seo-geo-collect-gsc --project-ref "$PROJECT_REF"
