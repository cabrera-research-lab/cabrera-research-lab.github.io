name: Collect SEO & GEO

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      property_id:
        description: 'Property id (practice, stsi-pro, camp, jost, cabreralab, evidence) or all'
        required: false
        default: 'all'

permissions:
  contents: read

concurrency:
  group: seo-geo-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch public pages and store snapshots
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SEO_GEO_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SEO_GEO_SUPABASE_SERVICE_ROLE_KEY }}
          PROPERTY_ID: ${{ github.event.inputs.property_id || 'all' }}
        run: |
          if [ "$PROPERTY_ID" != "" ] && [ "$PROPERTY_ID" != "all" ]; then
            node scripts/collect-seo-geo.mjs --property "$PROPERTY_ID"
          else
            node scripts/collect-seo-geo.mjs
          fi
